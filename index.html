<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Capture - Face, Hands & Body</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .camera-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        #videoElement {
            width: 100%;
            border-radius: 10px;
            background: #000;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .data-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .data-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .data-card h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .data-content {
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            color: white;
            font-weight: bold;
        }
        
        .status.connected {
            background: #4CAF50;
        }
        
        .status.disconnected {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Motion Capture System</h1>
            <p>Face • Hands • Body Tracking</p>
        </div>
        
        <div class="status" id="status">Disconnected</div>
        
        <div class="camera-container">
            <div class="video-wrapper">
                <video id="videoElement" autoplay playsinline></video>
            </div>
            
            <div class="controls">
                <button id="startBtn" onclick="startCapture()">Start Capture</button>
                <button id="stopBtn" onclick="stopCapture()" disabled>Stop Capture</button>
            </div>
        </div>
        
        <div class="data-panel">
            <div class="data-card">
                <h3>Face Landmarks (468 points)</h3>
                <div class="data-content" id="faceData">
                    Waiting for data...
                </div>
            </div>
            
            <div class="data-card">
                <h3>Pose Landmarks (33 points)</h3>
                <div class="data-content" id="poseData">
                    Waiting for data...
                </div>
            </div>
            
            <div class="data-card">
                <h3>Hands Landmarks (21 points each)</h3>
                <div class="data-content" id="handsData">
                    Waiting for data...
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/capture.js"></script>
</body>
</html>
