<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Capture - Face, Hands & Body Tracking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeIn 1s ease;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .camera-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.8s ease;
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Зеркальное отображение */
        }
        
        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .tracking-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 255, 0, 0.8);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            color: white;
            animation: pulse 2s infinite;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .data-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .data-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.8s ease;
            flex: 1;
        }
        
        .data-card h3 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .data-card h3 .icon {
            font-size: 1.5em;
        }
        
        .face-card h3 { border-color: #667eea; }
        .pose-card h3 { border-color: #764ba2; }
        .hands-card h3 { border-color: #f5576c; }
        
        .data-content {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: 250px;
            overflow-y: auto;
            color: #333;
        }
        
        .data-content::-webkit-scrollbar {
            width: 8px;
        }
        
        .data-content::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
        
        .landmark-count {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .status-badge {
            text-align: center;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .status-tracking {
            background: #4CAF50;
            color: white;
        }
        
        .status-idle {
            background: #FF9800;
            color: white;
        }
        
        .status-error {
            background: #f44336;
            color: white;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Motion Capture Pro</h1>
            <p class="subtitle">Real-time Face • Hands • Body Tracking</p>
        </div>
        
        <div class="status-badge status-idle" id="statusBadge">
            📷 Initializing camera...
        </div>
        
        <div class="main-content">
            <div class="camera-section">
                <div class="video-wrapper">
                    <video id="videoElement" autoplay playsinline muted></video>
                    <div class="camera-overlay">
                        <div class="tracking-indicator" id="trackingIndicator" style="display: none;">
                            ● Tracking Active
                        </div>
                    </div>
                </div>
                <div class="controls">
                    <button class="btn-stop" id="stopBtn" onclick="stopTracking()">
                        ⏹ Stop Tracking
                    </button>
                </div>
            </div>
            
            <div class="data-section">
                <div class="data-card face-card">
                    <h3>
                        <span class="icon">👤</span> Face Landmarks
                        <span class="landmark-count" id="faceCount">0 points</span>
                    </h3>
                    <div class="data-content" id="faceData">
                        <div style="color: #999;">Waiting for tracking data...</div>
                    </div>
                </div>
                
                <div class="data-card pose-card">
                    <h3>
                        <span class="icon">🧍</span> Body Pose
                        <span class="landmark-count" id="poseCount">0 points</span>
                    </h3>
                    <div class="data-content" id="poseData">
                        <div style="color: #999;">Waiting for tracking data...</div>
                    </div>
                </div>
                
                <div class="data-card hands-card">
                    <h3>
                        <span class="icon">✋</span> Hands Tracking
                        <span class="landmark-count" id="handsCount">0 points</span>
                    </h3>
                    <div class="data-content" id="handsData">
                        <div style="color: #999;">Waiting for tracking data...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/capture.js"></script>
</body>
</html>
